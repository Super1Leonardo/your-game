<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	%sveltekit.head%

	<script>
		(function () {
			try {
				let theme = localStorage.getItem('igra-theme') || 'light';
				document.documentElement.setAttribute('data-theme', theme);
			} catch (e) {
				document.documentElement.setAttribute('data-theme', 'light');
			}
		})();
	</script>
</head>

<body data-sveltekit-preload-data="hover" class="bg-base-300 text-base-content transition-colors duration-150">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
